services:
  hermes:
    build:
      context: .
      args:
        # Passes the variables from the host/env to the Docker build process
        - UID=${UID}
        - GID=${GID}
    container_name: hermes
    restart: unless-stopped
    command: sh -c "uv sync --all-extras && HERMES_ALLOW_ROOT_GATEWAY=1 uv run hermes gateway run"

    ports:
      - "8642:8642"
      - "9119:9119"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PWD}/opt_data:/opt/data
      - ${PWD}/opt_hermes/.hermes:/opt/hermes/.hermes
      - ${PWD}/output:/output
      # Mount the socket so the container can talk to the host's Docker engine
      - /var/run/docker.sock:/var/run/docker.sock      

      # Mount the agent source code for live editing and development (for hermes-webui to access as well)
      - hermes-agent-src:/opt/hermes

    environment:
      # Passes the variables to the running container
      - HERMES_UID=${UID}
      - HERMES_GID=${GID}      
      - GATEWAY_ALLOW_ALL_USERS=true
      - HERMES_OUTPUT_PATH=${PWD}/output
      - HERMES_DASHBOARD=1          
      - npm_config_cache=/tmp/.npm      
      - UV_CACHE_DIR=/opt/data/.uv-cache
      - HOME=/opt/hermes
      - HERMES_SANDBOX_TYPE=local 
      - XDG_CACHE_HOME=/tmp/.cache      

  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    container_name: hermes-webui
    depends_on:
      - hermes
    ports:
      - "8787:8787"
    volumes:
      - ${PWD}/opt_data:/home/hermeswebui/.hermes
      - ${PWD}/output:/workspace      
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_WEBUI_AGENT_DIR=/agent-src
      - WANTED_UID=${UID}
      - WANTED_GID=${GID}
      - UV_CACHE_DIR=/home/hermeswebui/.hermes/.uv-cache
      - UV_LINK_MODE=copy
      - HERMES_WEBUI_AGENT_DIR=/home/hermeswebui/.hermes/hermes-agent

volumes:
  hermes-agent-src: